<title id="title">Ideal system · reference architecture</title><desc id="desc">Generic target architecture: a verified scheduled runtime or a user request enters a coordinator that routes five specialist methods. Jobs, Companies and People hold operational records. Private evidence supports research, networking, tailoring and independent QA. Configured document tools produce checked application files; humans approve, contact and submit. This is a design, not an availability or deployment claim.</desc>
