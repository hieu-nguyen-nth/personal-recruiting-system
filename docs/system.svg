<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Personal recruiting system</title>
<desc id="desc">A request or verified cloud schedule starts an agent coordinator. The agent reads job and public research sources, uses private methods, updates Notion, and prepares documents for independent QA and human approval.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53667c"/></marker></defs>
<rect width="1200" height="720" rx="20" fill="#f5f7fb"/>
<g font-family="Arial, sans-serif" fill="#17283e"><text x="48" y="54" font-size="27" font-weight="700">Personal recruiting system</text><text x="48" y="83" font-size="16">Existing tools, one agent entry point, clear human decisions</text></g>
<g fill="none" stroke="#53667c" stroke-width="2.3" marker-end="url(#arrow)">
<path d="M310 170H415V260H470"/><path d="M890 170H785V260H730"/>
<path d="M310 294H470"/><path d="M890 294H730"/>
<path d="M560 330V398H300V432"/><path d="M640 330V398H900V432"/>
<path d="M900 532V578H794"/><path d="M606 620H390V532"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="70" y="120" width="240" height="100" rx="14" fill="#e4edff" stroke="#b6c9ef"/><text x="190" y="157" fill="#17283e" font-size="21" font-weight="700">You ask</text><text x="190" y="187" fill="#42566f" font-size="16">A JD, company or next step</text>
<rect x="890" y="120" width="240" height="100" rx="14" fill="#e4edff" stroke="#b6c9ef"/><text x="1010" y="157" fill="#17283e" font-size="21" font-weight="700">Cloud schedule</text><text x="1010" y="187" fill="#42566f" font-size="16">Only after a real run is verified</text>
<rect x="70" y="250" width="240" height="94" rx="14" fill="#fff" stroke="#c6d1df"/><text x="190" y="287" fill="#17283e" font-size="19" font-weight="700">Job and research sources</text><text x="190" y="315" fill="#42566f" font-size="16">Connected source + public web</text>
<rect x="890" y="250" width="240" height="94" rx="14" fill="#fff" stroke="#c6d1df"/><text x="1010" y="287" fill="#17283e" font-size="19" font-weight="700">Private evidence + methods</text><text x="1010" y="315" fill="#42566f" font-size="16">Evaluate · tailor · independent QA</text>
<rect x="470" y="200" width="260" height="130" rx="16" fill="#146e63"/><text x="600" y="243" fill="#fff" font-size="23" font-weight="700">Agent coordinator</text><text x="600" y="275" fill="#edf9f5" font-size="16">Screen · research · connect steps</text><text x="600" y="301" fill="#edf9f5" font-size="16">Save results and next actions</text>
<rect x="110" y="432" width="380" height="100" rx="14" fill="#fff" stroke="#91a9c8"/><text x="300" y="469" fill="#17283e" font-size="22" font-weight="700">Notion</text><text x="300" y="500" fill="#42566f" font-size="17">Jobs · companies · people · interactions</text>
<rect x="710" y="432" width="380" height="100" rx="14" fill="#fff" stroke="#91a9c8"/><text x="900" y="469" fill="#17283e" font-size="22" font-weight="700">Google Docs / Drive</text><text x="900" y="500" fill="#42566f" font-size="17">Editable draft · PDF · independent QA</text>
<rect x="606" y="578" width="340" height="92" rx="14" fill="#fff1db" stroke="#d3b480"/><text x="776" y="614" fill="#17283e" font-size="21" font-weight="700">You decide and act</text><text x="776" y="645" fill="#42566f" font-size="16">Revise · approve · contact · submit</text>
</g><text x="48" y="693" font-family="Arial, sans-serif" font-size="14" fill="#53667c">Agent work updates the trackers. Company priorities and final actions remain with you.</text>
</svg>
